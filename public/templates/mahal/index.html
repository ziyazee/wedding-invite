<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A Celebration of Love</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #100d0b; }
      .mahal-template__entry { display: grid; min-height: 100vh; min-height: 100dvh; place-items: center; overflow: hidden; background: #100d0b; }
      .mahal-template__entry-trigger { display: grid; width: min(100vw, 56.25dvh); height: min(100dvh, 177.7778vw); place-items: center; padding: 0; overflow: hidden; border: 0; background: transparent; cursor: pointer; }
      .mahal-template__entry-video { display: block; width: auto; height: min(100vh, 177.7778vw); height: min(100dvh, 177.7778vw); max-width: 100vw; max-height: 100dvh; aspect-ratio: 9 / 16; object-fit: contain; pointer-events: none; }
      .mahal-template__music { position: absolute; z-index: 2; right: calc(3% + 36px); bottom: calc(7.2% - 5px); display: grid; width: 46px; height: 46px; place-items: center; border: 1px solid #f7efe388; border-radius: 50%; background: #100d0bd9; color: #f7efe3; cursor: pointer; font: 20px Georgia,serif; }
      .mahal-template__sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .mahal-template__hero { min-height: 100vh; display: grid; align-content: center; justify-items: center; gap: 1rem; padding: 2rem; color: #f7efe3; text-align: center; }
    </style>
  </head>
  <body>
    <main class="mahal-template">
      <section class="mahal-template__entry" aria-label="Wedding invitation opening video">
        <button class="mahal-template__entry-trigger" id="mahal-play" type="button" aria-label="Play wedding invitation video">
          <video class="mahal-template__entry-video" id="mahal-opening-video" src="/templates/mahal/assets/opening.mp4" poster="/templates/mahal/assets/opening-poster.jpg" preload="auto" playsinline aria-label="Opening video"></video>
          <span class="mahal-template__sr-only">Tap to play the wedding invitation video</span>
        </button>
        <button class="mahal-template__music" id="mahal-music-toggle" type="button" aria-label="Mute music">♫</button>
      </section>
      <section class="mahal-template__hero" aria-labelledby="mahal-title">
        <p class="mahal-template__eyebrow">Together with their families</p>
        <h1 id="mahal-title">A Celebration of Love</h1>
        <p class="mahal-template__names">Partner One &amp; Partner Two</p>
        <p class="mahal-template__date">Wedding date · Venue</p>
      </section>
    </main>
    <script>
      var mahalVideo = document.getElementById('mahal-opening-video');
      var mahalMusicEnabled = true;
      document.getElementById('mahal-play').addEventListener('click', function () {
        mahalVideo.muted = !mahalMusicEnabled;
        mahalVideo.play().catch(function () {});
      });
      document.getElementById('mahal-music-toggle').addEventListener('click', function (event) {
        mahalMusicEnabled = !mahalMusicEnabled;
        mahalVideo.muted = !mahalMusicEnabled;
        event.currentTarget.setAttribute('aria-label', mahalMusicEnabled ? 'Mute music' : 'Enable music');
        event.currentTarget.textContent = mahalMusicEnabled ? '♫' : '♪̸';
      });
    </script>
  </body>
</html>
